<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My dashboard</title>
<style>
:root{
  --bg:#E9EEF3; --panel:#F8FAFC; --ink:#16202E; --muted:#5B6B7F; --line:#CBD5E1;
  --accent:#0E7C7B; --accent-ink:#FFFFFF; --soft:#DCE6EE; --danger:#B4343A;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1620; --panel:#172130; --ink:#E6EDF5; --muted:#93A4B8; --line:#2A384B;
    --accent:#3FBFB2; --accent-ink:#0B1A19; --soft:#22324A; --danger:#F08A8F;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Avenir Next","Segoe UI","Noto Sans","Helvetica Neue",system-ui,sans-serif;
  line-height:1.5; padding:clamp(16px,4vw,40px);
}
main{max-width:1100px;margin:0 auto}
h1,h2,p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Hero */
.hero{margin-bottom:28px}
.date{color:var(--muted);font-size:1rem}
h1{font-size:clamp(2.1rem,6vw,3.6rem);font-weight:800;letter-spacing:-0.025em;line-height:1.05;margin:4px 0 14px}
.clockrow{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.clock{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.daytext{color:var(--muted)}
.daybar{height:10px;border-radius:99px;background:var(--soft);margin-top:12px;overflow:hidden}
.daybar span{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .6s}

/* Panels */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.p-check{grid-column:span 5}
.p-goals{grid-column:span 7}
.p-hours{grid-column:span 7}
.p-notes{grid-column:span 5}
@media (max-width:820px){.p-check,.p-goals,.p-hours,.p-notes{grid-column:1/-1}}
h2{font-size:1.15rem;font-weight:700;margin-bottom:2px}
.sub{color:var(--muted);font-size:.92rem;margin-bottom:14px}
.empty{color:var(--muted);font-size:.95rem;padding:8px 0}

ul{list-style:none;margin:0 0 12px;padding:0}
li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li label{flex:1;cursor:pointer}
li.done label{color:var(--muted);text-decoration:line-through}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}

form{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],input[type=date],input[type=number],textarea{
  font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;
}
input[type=text]{flex:1 1 160px}
input[type=number]{width:90px}
button{
  font:inherit;font-weight:600;cursor:pointer;border-radius:8px;padding:8px 14px;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.x{background:transparent;border:0;color:var(--muted);padding:4px 8px;font-size:1.1rem;line-height:1}
button.x:hover{color:var(--danger)}

/* Countdowns */
.goal .num{font-size:1.7rem;font-weight:800;min-width:68px;font-variant-numeric:tabular-nums}
.goal .unit{color:var(--muted);font-size:.9rem}
.goal .name{flex:1}
.goal .when{color:var(--muted);font-size:.85rem}

/* Chart */
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;margin:6px 0 14px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.bar{width:100%;max-width:56px;background:var(--soft);border-radius:6px 6px 2px 2px;min-height:3px}
.col.today .bar{background:var(--accent)}
.val{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lbl{font-size:.85rem;font-weight:600}
.total{font-weight:600;margin-bottom:12px}

textarea{width:100%;min-height:210px;resize:vertical}
footer{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){.daybar span{transition:none}}
</style>
</head>
<body>
<main>
  <header class="hero">
    <p class="date" id="date"></p>
    <h1 id="greet"></h1>
    <div class="clockrow">
      <span class="clock" id="clock"></span>
      <span class="daytext" id="daytext"></span>
    </div>
    <div class="daybar" aria-hidden="true"><span id="dayfill"></span></div>
  </header>

  <div class="grid">
    <section class="panel p-check">
      <h2>Daily checklist</h2>
      <p class="sub" id="checksub"></p>
      <ul id="tasks"></ul>
      <form id="taskform">
        <input type="text" id="taskin" placeholder="Add something you do every day" aria-label="New daily item" maxlength="120">
        <button type="submit">Add</button>
      </form>
    </section>

    <section class="panel p-goals">
      <h2>Countdowns</h2>
      <p class="sub">Days left until the things that matter.</p>
      <ul id="goals"></ul>
      <form id="goalform">
        <input type="text" id="goalname" placeholder="What are you counting down to?" aria-label="Goal name" maxlength="80" required>
        <input type="date" id="goaldate" aria-label="Goal date" required>
        <button type="submit">Add</button>
      </form>
    </section>

    <section class="panel p-hours">
      <h2>Hours focused</h2>
      <p class="sub">The last 7 days. Log your hours at the end of each day.</p>
      <div class="chart" id="chart" role="img" aria-label="Bar chart of hours focused over the last 7 days"></div>
      <p class="total" id="total"></p>
      <form id="hourform">
        <input type="date" id="hourdate" aria-label="Day">
        <input type="number" id="hourval" min="0" max="24" step="0.25" placeholder="Hours" aria-label="Hours focused" required>
        <button type="submit">Save hours</button>
      </form>
    </section>

    <section class="panel p-notes">
      <h2>Notes</h2>
      <p class="sub">Saved as you type.</p>
      <textarea id="notes" placeholder="Ideas, reminders, anything." aria-label="Notes"></textarea>
    </section>
  </div>

  <footer>
    <span>Your data is saved in this browser only.</span>
    <button class="ghost" id="export" type="button">Export backup</button>
    <button class="ghost" id="importbtn" type="button">Import backup</button>
    <input type="file" id="importfile" accept="application/json" hidden>
  </footer>
</main>

<script>
(function(){
  var KEY = 'lifedash.v1';
  function blank(){ return {tasks:[], goals:[], hours:{}, notes:''}; }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var s = JSON.parse(raw), b = blank();
        return {tasks:s.tasks||b.tasks, goals:s.goals||b.goals, hours:s.hours||b.hours, notes:s.notes||''};
      }
    }catch(e){}
    return blank();
  }
  var state = load();
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
  function $(id){ return document.getElementById(id); }
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function key(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text!==undefined) e.textContent = text;
    return e;
  }

  /* Hero: greeting, clock, day progress */
  function tick(){
    var now = new Date(), h = now.getHours();
    var g = h<5 ? 'Still up' : h<12 ? 'Good morning' : h<17 ? 'Good afternoon' : h<21 ? 'Good evening' : 'Good night';
    $('greet').textContent = g;
    $('date').textContent = now.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    $('clock').textContent = now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    var start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var pct = Math.min(100, Math.round((now - start) / 864000) / 1);
    $('dayfill').style.width = pct+'%';
    $('daytext').textContent = 'Today is '+Math.round(pct)+'% done';
  }

  /* Daily checklist */
  function renderTasks(){
    var today = key(new Date()), ul = $('tasks');
    ul.textContent = '';
    if(!state.tasks.length){
      ul.appendChild(el('li','empty','Nothing here yet. Add your first daily habit below.'));
    }
    var done = 0;
    state.tasks.forEach(function(t){
      var isDone = t.doneOn === today; if(isDone) done++;
      var li = el('li', isDone ? 'done' : '');
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = isDone; cb.id = 't'+t.id;
      cb.addEventListener('change', function(){
        t.doneOn = cb.checked ? today : null; save(); renderTasks();
      });
      var lab = el('label', '', t.text); lab.setAttribute('for', cb.id);
      var x = el('button','x','\u00D7'); x.type='button'; x.setAttribute('aria-label','Delete '+t.text);
      x.addEventListener('click', function(){
        state.tasks = state.tasks.filter(function(o){ return o.id!==t.id; }); save(); renderTasks();
      });
      li.appendChild(cb); li.appendChild(lab); li.appendChild(x); ul.appendChild(li);
    });
    $('checksub').textContent = state.tasks.length
      ? done+' of '+state.tasks.length+' done today. The list resets every morning.'
      : 'Things you want to do every day.';
  }
  $('taskform').addEventListener('submit', function(e){
    e.preventDefault();
    var v = $('taskin').value.trim(); if(!v) return;
    state.tasks.push({id:uid(), text:v, doneOn:null}); $('taskin').value=''; save(); renderTasks();
  });

  /* Countdowns */
  function renderGoals(){
    var ul = $('goals'); ul.textContent = '';
    var t0 = new Date(); t0 = new Date(t0.getFullYear(), t0.getMonth(), t0.getDate());
    if(!state.goals.length){
      ul.appendChild(el('li','empty','No countdowns yet. Add an exam, trip or deadline below.'));
    }
    state.goals.slice().sort(function(a,b){ return a.date<b.date ? -1 : 1; }).forEach(function(g){
      var d = new Date(g.date+'T00:00:00');
      var days = Math.round((d - t0)/86400000);
      var li = el('li','goal');
      li.appendChild(el('span','num', days===0 ? 'Today' : String(Math.abs(days))));
      li.appendChild(el('span','unit', days===0 ? '' : (days>0 ? (days===1?'day left':'days left') : (days===-1?'day ago':'days ago'))));
      var mid = el('span','name', g.name);
      mid.appendChild(document.createElement('br'));
      mid.appendChild(el('span','when', d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})));
      li.appendChild(mid);
      var x = el('button','x','\u00D7'); x.type='button'; x.setAttribute('aria-label','Delete '+g.name);
      x.addEventListener('click', function(){
        state.goals = state.goals.filter(function(o){ return o.id!==g.id; }); save(); renderGoals();
      });
      li.appendChild(x); ul.appendChild(li);
    });
  }
  $('goalform').addEventListener('submit', function(e){
    e.preventDefault();
    var n = $('goalname').value.trim(), d = $('goaldate').value; if(!n||!d) return;
    state.goals.push({id:uid(), name:n, date:d}); $('goalname').value=''; $('goaldate').value=''; save(); renderGoals();
  });

  /* Hours chart */
  function renderHours(){
    var chart = $('chart'); chart.textContent = '';
    var days = [], i, now = new Date();
    for(i=6;i>=0;i--){ var d = new Date(now.getFullYear(), now.getMonth(), now.getDate()-i); days.push(d); }
    var vals = days.map(function(d){ return Number(state.hours[key(d)])||0; });
    var max = Math.max.apply(null, vals.concat([4])), sum = 0;
    days.forEach(function(d,idx){
      sum += vals[idx];
      var col = el('div','col'+(idx===6?' today':''));
      col.appendChild(el('span','val', vals[idx] ? String(vals[idx]) : ''));
      var bar = el('div','bar'); bar.style.height = Math.round(vals[idx]/max*100*0.78)+'%';
      col.appendChild(bar);
      col.appendChild(el('span','lbl', d.toLocaleDateString(undefined,{weekday:'short'})));
      chart.appendChild(col);
    });
    $('total').textContent = sum ? 'Total this week: '+(Math.round(sum*100)/100)+' hours' : 'No hours logged this week yet.';
  }
  $('hourdate').value = key(new Date());
  $('hourform').addEventListener('submit', function(e){
    e.preventDefault();
    var d = $('hourdate').value, v = parseFloat($('hourval').value);
    if(!d || isNaN(v) || v<0 || v>24) return;
    state.hours[d] = v; $('hourval').value=''; save(); renderHours();
  });

  /* Notes */
  var timer;
  $('notes').value = state.notes;
  $('notes').addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){ state.notes = $('notes').value; save(); }, 300);
  });

  /* Backup */
  $('export').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'dashboard-backup-'+key(new Date())+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });
  $('importbtn').addEventListener('click', function(){ $('importfile').click(); });
  $('importfile').addEventListener('change', function(){
    var f = this.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var s = JSON.parse(r.result);
        if(typeof s!=='object' || s===null) throw new Error('bad');
        if(!confirm('Replace what is on this page with the backup?')) return;
        var b = blank();
        state = {tasks:s.tasks||b.tasks, goals:s.goals||b.goals, hours:s.hours||b.hours, notes:s.notes||''};
        save(); $('notes').value = state.notes; renderTasks(); renderGoals(); renderHours();
      }catch(e){ alert('That file is not a valid backup.'); }
    };
    r.readAsText(f); this.value = '';
  });

  tick(); setInterval(tick, 30000);
  renderTasks(); renderGoals(); renderHours();
})();
</script>
</body>
</html>
